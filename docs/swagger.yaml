  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.PermissionResponse:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.RegisterTenantRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      tenant_address:
        type: string
      tenant_name:
        type: string
      tenant_phone:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - tenant_name
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.RegisterTenantResponse:
    properties:
      tenant:
        $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.Tenant'
      tenant_id:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.User'
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: string
      is_system_role:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.PermissionResponse'
        type: array
      tenant_id:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.Tenant:
    properties:
      about:
        items:
          type: integer
        type: array
      address:
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: string
      name:
        type: string
      payment_account_id:
        type: string
      phone:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.TenantInvitation:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_used:
        type: boolean
      role_id:
        type: string
      tenant_id:
        type: string
      token:
        type: string
      updated_at:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.TutorListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.TutorResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.Pagination'
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.TutorResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      status:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.UpdateMemberRoleRequest:
    properties:
      role_id:
        type: string
    required:
    - role_id
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
    required:
    - name
    - permission_ids
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.UpdateTenantSettingsRequest:
    properties:
      about:
        items:
          type: integer
        type: array
      address:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  github_com_kelolakelas_kelolakelas-identity-service_internal_domain.User:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_parent:
        type: boolean
      last_name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_delivery_http_handler.CreateInvitationPayload:
    properties:
      email:
        type: string
      role_id:
        type: string
    required:
    - email
    - role_id
    type: object
  internal_delivery_http_handler.LoginPayload:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_delivery_http_handler.RegisterInvitedUserPayload:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - first_name
    - last_name
    - password
    - token
    type: object
  internal_delivery_http_handler.RegisterPayload:
    properties:
      email:
        type: string
      first_name:
        type: string
      is_parent:
        type: boolean
      last_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
info:
  contact: {}
  description: Identity & Access Management Service for KelolaKelas Platform
  title: KelolaKelas Identity Service API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT access token
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handler.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Register a new end-user (student or parent)
        Registration does not auto-login. The client must call /auth/login after registration.
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handler.RegisterPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.AuthUserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      summary: Register new user
      tags:
      - Auth
  /api/v1/invitations:
    post:
      consumes:
      - application/json
      description: Invite a new member to join the tenant with a specific role
      parameters:
      - description: Tenant ID dalam format UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Create invitation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handler.CreateInvitationPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.TenantInvitation'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create tenant invitation
      tags:
      - Invitations
  /api/v1/invitations/register:
    post:
      consumes:
      - application/json
      description: Complete user registration using a valid invitation token
      parameters:
      - description: Register invited user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handler.RegisterInvitedUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      summary: Register user via invitation
      tags:
      - Invitations
  /api/v1/invitations/verify:
    get:
      consumes:
      - application/json
      description: Verify validity of an invitation token
      parameters:
      - description: Invitation token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.TenantInvitation'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      summary: Verify invitation token
      tags:
      - Invitations
  /api/v1/members:
    get:
      description: Fetch members belonging to the active tenant.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: page_size
        type: integer
      - description: Search email or name
        in: query
        name: search
        type: string
      - description: active or inactive
        in: query
        name: status
        type: string
      - description: Role UUID
        in: query
        name: role_id
        type: string
      - description: created_at, updated_at, email, or name
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.MemberListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List tenant members
      tags:
      - Members
  /api/v1/members/{id}:
    get:
      parameters:
      - description: Member UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.MemberResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get tenant member
      tags:
      - Members
    delete:
      description: Soft delete a member from the active tenant.
      parameters:
      - description: Member UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a tenant member
      tags:
      - Members
  /api/v1/members/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: Member UUID
        in: path
        name: id
        required: true
        type: string
      - description: Role payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.UpdateMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.MemberResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update member role
      tags:
      - Members
  /api/v1/permissions:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available permissions in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.PermissionResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all system permissions
      tags:
      - Roles & Permissions
  /api/v1/roles:
    get:
      consumes:
      - application/json
      description: Fetch all custom and system roles for a specific tenant
      parameters:
      - description: Tenant ID dalam format UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.RoleResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get tenant roles
      tags:
      - Roles & Permissions
    post:
      consumes:
      - application/json
      description: Create a new custom role with assigned permissions for a tenant
      parameters:
      - description: Tenant ID dalam format UUID
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Create role payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-identity-service_internal_domain.HTTPResponse'
            - properties:
                data:
